<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&display=swap');
    </style>
    <title>Product Preview Card</title>
</head>

<body>
    <main class="container-card">
        <article class="product-preview-card">
            <div class="content-card">
                <img src="assets/image/image-product-desktop.jpg" alt="Gabrielle Essence perfume bottle"class="perfume-image">
                <div class="content-perfume">
                    <div class="comercial-description">
                        <span class="perfume">PERFUME</span>
                        <h1 class="title-comercial">Gabrielle Essence Eau de Parfum</h1>
                        <p class="description">A floral, solar and voluptuous interpretation
                            composed by Olivier Polge, Perfumer-Creator for the House of CHANEL.
                        </p>
                    </div>
                    <div class="prices">
                        <span class="new-price">$149.99</span>
                        <del class="old-price">$169.99</del>
                    </div>
                    <button class="add-cart"><img src="assets/image/icon-cart.svg" alt=""class="cart-icon">Add to Car</button>
                </div>

            </div>
        </article>
    </main>
</body>

</html>
